<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lokalny symulator otwierania skrzynek CS2 z upgraderem. Wirtualne środki, bez prawdziwych pieniędzy.">
  <title>CS2 Case Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff9f1c'/%3E%3Cpath d='M16 6l8 10-8 10-8-10z' fill='%231f1300'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">Przejdź do treści</a>

  <header class="topbar">
    <a class="logo" href="#/skrzynki" aria-label="CS2 Case Lab – skrzynki">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 9-7 9-7-9z" /></svg>
      </span>
      <span class="logo-text">CS2 <b>Case Lab</b></span>
    </a>

    <nav class="nav" aria-label="Główna nawigacja">
      <a href="#/skrzynki" data-route="skrzynki">Skrzynki</a>
      <a href="#/upgrader" data-route="upgrader">Upgrader</a>
      <a href="#/ekwipunek" data-route="ekwipunek">Ekwipunek <span class="badge" id="inv-count">0</span></a>
    </nav>

    <div class="wallet">
      <button type="button" class="icon-btn" id="sound-btn" data-action="toggle-sound" aria-label="Dźwięk" title="Dźwięk"></button>
      <div class="balance" id="balance-box" aria-live="polite">
        <span class="balance-label">Saldo</span>
        <strong id="balance">0,00 zł</strong>
      </div>
      <button type="button" class="btn btn-accent" data-action="open-funds" aria-label="Dodaj środki">
        <span aria-hidden="true">+</span><span class="hide-sm" aria-hidden="true">Dodaj środki</span>
      </button>
    </div>
  </header>

  <section class="feed" aria-label="Ostatnie dropy">
    <span class="feed-title">Ostatnie<br>dropy</span>
    <div class="feed-track" id="feed"></div>
  </section>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    Symulator dla zabawy – wszystkie środki są wirtualne i zapisują się tylko w tej przeglądarce.
    Strona nie jest powiązana z Valve.
  </footer>

  <!-- Add funds -->
  <dialog id="funds-dialog" class="dialog" aria-labelledby="funds-title">
    <form id="funds-form" novalidate>
      <div class="dialog-head">
        <h2 id="funds-title">Dodaj środki</h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Zamknij">✕</button>
      </div>
      <p class="muted" id="funds-hint">Środki są wirtualne – dodaj tyle, ile chcesz.</p>
      <label class="field">
        <span>Kwota (zł)</span>
        <input type="number" id="funds-amount" class="input" min="1" max="1000000" step="0.01" inputmode="decimal" required>
      </label>
      <p class="field-error" id="funds-error" role="alert"></p>
      <div class="chips" role="group" aria-label="Szybki wybór kwoty">
        <button type="button" class="btn btn-sm" data-action="funds-preset" data-amount="10">10 zł</button>
        <button type="button" class="btn btn-sm" data-action="funds-preset" data-amount="50">50 zł</button>
        <button type="button" class="btn btn-sm" data-action="funds-preset" data-amount="100">100 zł</button>
        <button type="button" class="btn btn-sm" data-action="funds-preset" data-amount="500">500 zł</button>
        <button type="button" class="btn btn-sm" data-action="funds-preset" data-amount="1000">1000 zł</button>
        <button type="button" class="btn btn-sm" data-action="funds-preset" data-amount="10000">10 000 zł</button>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" data-action="close-dialog">Anuluj</button>
        <button type="submit" class="btn btn-primary">Dodaj środki</button>
      </div>
    </form>
  </dialog>

  <!-- Case drop result -->
  <dialog id="drop-dialog" class="dialog dialog-wide" aria-labelledby="drop-title">
    <div class="dialog-head">
      <h2 id="drop-title">Twój drop</h2>
      <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Zamknij">✕</button>
    </div>
    <div class="drop-grid" id="drop-grid"></div>
    <p class="drop-total" id="drop-total"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" data-action="drop-again">Otwórz ponownie</button>
      <button type="button" class="btn btn-danger" data-action="drop-sell-all" id="drop-sell-all">Sprzedaj wszystko</button>
      <button type="button" class="btn btn-primary" data-action="close-dialog" autofocus>Zachowaj</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
