<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Interactive rating component</title>

</head>
<body>

  <section class="rating-section">
    <figure>
      <img  src="./images/icon-star.svg" alt="">
    </figure>
    <h1>How did we do?</h1>
    <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>

    <div class="rating-buttons">
      <button class="rating-btn" aria-label="Rate 1 out of 5">1</button>
      <button class="rating-btn" aria-label="Rate 2 out of 5">2</button>
      <button class="rating-btn" aria-label="Rate 3 out of 5">3</button>
      <button class="rating-btn" aria-label="Rate 4 out of 5">4</button>
      <button class="rating-btn" class="rating-btn" aria-label="Rate 5 out of 5">5</button>
    </div>

    <button type="submit" id="submit-btn">SUBMIT</button>
  </section>
  
  <section class="thank-you-section">
      <img class="thank-you-img" src="./images/illustration-thank-you.svg" alt="">

      <button aria-label="select another rating" class="you-selected-btn">You selected <span class="rate-selected">-</span> out of 5</button>

      <h1>Thank you!</h1>
      <p>We appreciate you taking the time to give a rating. If you ever need more support, 
          don’t hesitate to get in touch!</p>
  </section>

  <script src="./script.js"></script>
</body>
</html>
